name: GitHub Actions

on:
  schedule:
    - cron: "8 11 * * 5" # At 11:08 on Friday
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 20
          - 22
          - 24
        eslint-version:
          - 9

    env:
      ESLINT_VERSION: ${{ matrix.eslint-version }}

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - run: pnpm install # without `--frozen-lockfile` since there is no pnpm-lock.yaml in this project
      - run: pnpm build
      - run: pnpm test

      - name: Install this version of eslint-plugin-editorconfig
        run: pnpm pack && pnpm install "eslint-plugin-editorconfig-$(jq --raw-output .version package.json).tgz"
      - run: pnpm lint

  release:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - run: pnpm install # without `--frozen-lockfile` since there is no pnpm-lock.yaml in this project
      - run: pnpm build

      - name: set npm auth token
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" > ~/.npmrc
      - run: pnpm release
